qualifier_requirements:
  min_age: 18
  good_moral_character: "Required. The board may refuse only if there is a substantial connection between the lack of good moral character and the professional responsibilities of a certified contractor, and the finding is supported by clear and convincing evidence."
  experience_options:
    - "Option 1: Bachelor's degree from an accredited 4-year college in an appropriate field of engineering, architecture or building construction, plus 1 year of proven experience in the category (2,000 person-hours counts as full-time)."
    - "Option 2: At least 4 years of active experience as a skilled worker (learned the trade through apprenticeship and able to command a mechanic's rate) or as a foreman. At least 1 year must be as a foreman."
    - "Option 3: A combination: (a) 1 year as a foreman plus 3 years of accredited college-level credits; or (b) 1 year as a skilled worker, 1 year as a foreman and 2 years of credits; or (c) 2 years as a skilled worker, 1 year as a foreman and 1 year of credits."
  upgrade_paths:
    - "Certified residential to certified building: 3 years of proven experience in the classification, and pass the building exam"
    - "Certified residential or certified building to certified general: 4 years of proven experience in the classification, and pass the general exam"
    - "Air-conditioning Class C to Class B: 3 years; Class C to Class A: 4 years; Class B to Class A: 1 year"
    - "Pool servicing to residential pool: 3 years; pool servicing to commercial pool: 4 years; residential pool to commercial pool: 1 year"
    - "Pool/spa servicing: 60 hours of board-approved instruction plus 1 year of proven experience"
  confidence: primary
  source: https://www.flsenate.gov/Laws/Statutes/2024/489.111
  note: "Source is Florida Statutes s. 489.111, 2024 edition (including 2025C). Newer editions (2025, 2026) exist. Check for amendments before publishing. The Senate site says its statute text is unverified for official purposes."

